<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — NOVA</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <span class="brand-mark">NOVA</span>
    <div class="navbar-right">
      <button class="btn-pill btn-pill--outline" id="logout-btn" style="color: var(--paper); border-color: var(--line-on-ink);">
        Log out
      </button>
    </div>
  </nav>

  <main class="dashboard-main">
    <a href="dashboard.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M13 5l7 7-7 7" />
      </svg>
      All projects
    </a>

    <div class="project-header">
      <div>
        <h1 id="project-title">Loading…</h1>
        <p id="project-description"></p>
      </div>
      <div class="project-header-actions">
        <button class="btn-pill btn-pill--secondary" id="open-member-modal">Add member</button>
        <button class="btn-pill btn-pill--solid" id="open-task-modal">New task</button>
      </div>
    </div>

    <div class="members-strip" id="members-strip"></div>

    <p class="progress-label" id="progress-label">Loading tasks…</p>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <div class="board">
      <div class="board-column">
        <div class="column-header">
          <h3>To Do</h3>
          <span class="column-count" id="count-todo">0</span>
        </div>
        <div id="column-todo"></div>
      </div>

      <div class="board-column">
        <div class="column-header">
          <h3>In Progress</h3>
          <span class="column-count" id="count-in_progress">0</span>
        </div>
        <div id="column-in_progress"></div>
      </div>

      <div class="board-column">
        <div class="column-header">
          <h3>Done</h3>
          <span class="column-count" id="count-done">0</span>
        </div>
        <div id="column-done"></div>
      </div>
    </div>
  </main>

  <!-- Task modal (create + edit) -->
  <div class="modal-backdrop" id="task-modal">
    <div class="modal-box wide">
      <h2 id="task-modal-title">New task</h2>

      <div class="form-error-banner" id="task-modal-error"></div>

      <form id="task-form" novalidate>
        <div class="field">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" required />
        </div>

        <div class="field">
          <label for="task-description">Description (optional)</label>
          <input type="text" id="task-description" />
        </div>

        <div class="field">
          <label for="task-assignee">Assignee</label>
          <select id="task-assignee"></select>
        </div>

        <div class="field">
          <label for="task-status">Status</label>
          <select id="task-status">
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-pill btn-pill--secondary" id="close-task-modal">Cancel</button>
          <button type="submit" class="btn-pill btn-pill--solid">Save</button>
        </div>

        <div class="modal-delete-row">
          <button type="button" class="text-link-danger" id="delete-task-btn" style="display: none;">
            Delete this task
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add member modal -->
  <div class="modal-backdrop" id="member-modal">
    <div class="modal-box">
      <h2>Add a team member</h2>

      <div class="form-error-banner" id="member-modal-error"></div>

      <form id="member-form" novalidate>
        <div class="field">
          <label for="member-email">Their email</label>
          <input type="email" id="member-email" required />
        </div>
        <p style="font-size: 0.8rem; color: var(--muted); margin-top: -10px;">
          They need to already have a NOVA account.
        </p>

        <div class="modal-actions">
          <button type="button" class="btn-pill btn-pill--secondary" id="close-member-modal">Cancel</button>
          <button type="submit" class="btn-pill btn-pill--solid">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/project.js"></script>
</body>
</html>
