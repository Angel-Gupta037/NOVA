<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — NOVA</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <span class="brand-mark">NOVA</span>
    <div class="navbar-right">
      <span>Hi, <span id="user-name">there</span></span>
      <button class="btn-pill btn-pill--outline" id="logout-btn" style="color: var(--paper); border-color: var(--line-on-ink);">
        Log out
      </button>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="dashboard-header">
      <h1>Your projects</h1>
      <button class="btn-pill btn-pill--solid" id="open-create-modal">
        New project
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>

    <hr class="section-divider" />

    <div class="project-grid" id="project-grid"></div>

    <div class="empty-state" id="empty-state">
      <h3>No projects yet</h3>
      <p>Create your first project to start adding tasks and inviting your team.</p>
    </div>
  </main>

  <!-- Create project modal -->
  <div class="modal-backdrop" id="create-modal">
    <div class="modal-box">
      <h2>New project</h2>

      <div class="form-error-banner" id="modal-error"></div>

      <form id="create-project-form" novalidate>
        <div class="field">
          <label for="project-name">Project name</label>
          <input type="text" id="project-name" required />
        </div>

        <div class="field">
          <label for="project-description">Description (optional)</label>
          <input type="text" id="project-description" />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-pill btn-pill--secondary" id="close-create-modal">Cancel</button>
          <button type="submit" class="btn-pill btn-pill--solid">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
